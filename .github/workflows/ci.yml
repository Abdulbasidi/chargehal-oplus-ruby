name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run static validation
        run: ./tools/validate-static.sh

  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # android-actions/setup-android is deliberately not used here: its v3
      # line installs the removed legacy `tools` package and the runner already
      # ships the SDK + cmdline-tools at $ANDROID_SDK_ROOT, so we only need the
      # NDK on top.
      - name: Install Android NDK r29
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOLS_BIN="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit | xargs -r dirname)"
          if [ -z "$TOOLS_BIN" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          PATH="$TOOLS_BIN:$PATH"
          export PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;29.0.14206865"
          test -x "$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      - name: Build Android ARM64 release
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$SDK/ndk/29.0.14206865"
          ./build.sh release

      - name: Validate Android binary
        run: ./tools/validate-static.sh dist/vendor.oplus.hardware.charger-V11-service

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: charger-hal-ruby
          path: dist/
          if-no-files-found: error

      # One release per build, tagged with the short SHA, carrying the three
      # files a ROM integrator needs: the service binary, the init .rc and the
      # VINTF manifest. Re-running the same commit re-uploads instead of
      # failing on an existing tag. PR builds never publish.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SHA="$(git rev-parse --short=7 HEAD)"
          TAG="snapshot-$SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              dist/vendor.oplus.hardware.charger-V11-service \
              dist/charger-hal-service.rc \
              dist/charger-hal-service.xml
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Charger HAL snapshot $SHA" \
              --notes "Automated build of $SHA ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA): service binary (installs to /odm/bin/hw), init .rc, VINTF manifest. Not verified on a device." \
              dist/vendor.oplus.hardware.charger-V11-service \
              dist/charger-hal-service.rc \
              dist/charger-hal-service.xml
          fi
          gh release view "$TAG" --json tagName,url -q '"\(.tagName) \(.url)"'

  publish-telegram:
    name: Publish charger HAL to Telegram
    needs: android-build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: charger-hal-ruby
          path: artifact

      - name: Locate HAL binary
        id: locate
        run: |
          set -euo pipefail
          BIN="$(find artifact -type f -name 'vendor.oplus.hardware.charger-V11-service' -print -quit)"
          if [ -z "$BIN" ]; then
            echo "::error::charger HAL binary not found in artifact"
            find artifact -maxdepth 6 -type f -print
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          ls -l "$BIN"
          file "$BIN"

      - name: Send HAL binary to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BIN: ${{ steps.locate.outputs.bin }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set, skipping Telegram upload"
            exit 0
          fi
          test -f "$BIN"

          api="https://api.telegram.org/bot${BOT_TOKEN}"
          name=$(basename "$BIN")
          size=$(stat -c%s "$BIN")
          size_mb=$(awk -v b="$size" 'BEGIN { printf "%.3f", b / 1048576 }')
          sha=$(sha256sum "$BIN" | cut -d' ' -f1)
          sha_short=$(echo "$sha" | cut -c 1-12)
          short_commit=$(echo "$COMMIT_SHA" | cut -c 1-7)
          run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          header=$(printf '<b>ruby charger HAL</b>\n\n<b>File:</b> <code>%s</code>\n<b>Size:</b> %s MB (%s bytes)\n<b>SHA-256:</b> <code>%s</code>\n<b>Commit:</b> <code>%s</code>\n<b>Run:</b> #%s\n\nVendor binary, not a flashable zip.' \
            "$name" "$size_mb" "$size" "$sha" "$short_commit" "$RUN_NUMBER")

          curl -sS --fail --retry 3 --retry-delay 5 -X POST "${api}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode text="${header}"
          echo

          caption=$(printf '<b>%s</b>\n%s MB\nSHA-256: <code>%s</code>\n<code>%s</code>' \
            "$name" "$size_mb" "$sha_short" "$run_url")
          curl -sS --fail --retry 3 --retry-delay 5 -F "document=@${BIN}" \
            -F chat_id="${CHAT_ID}" \
            -F parse_mode="HTML" \
            --form-string "caption=$caption" \
            "${api}/sendDocument"
          echo
